<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Realtime Console</title>
</head>
<body>

  <!-- CREATE / WRITE USER -->
  <h2>Create / Write User</h2>
  <input type="text" id="userId" placeholder="User ID"><br><br>
  <input type="text" id="name" placeholder="Full Name"><br><br>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="text" id="phone" placeholder="Phone Number"><br><br>
  <input type="text" id="address" placeholder="Address"><br><br>
  <input type="date" id="dob"><br><br>
  <input type="text" id="gender" placeholder="Gender"><br><br>
  <input type="text" id="marital_status" placeholder="Marital Status"><br><br>
  <input type="text" id="interest_area" placeholder="Interest Area"><br><br>
  <input type="text" id="major" placeholder="Major"><br><br>

  <button onclick="writeUser()">Write User</button>

  <hr>

  <!-- READ USERS -->
  <h2>Read Users</h2>
  <button onclick="readUsers()">Read All Users (Check Console)</button>

  <hr>

  <!-- UPDATE USER -->
  <h2>Update User</h2>
  <input type="text" id="updateUserId" placeholder="User ID"><br><br>
  <input type="text" id="updateName" placeholder="New Name"><br><br>
  <input type="email" id="updateEmail" placeholder="New Email"><br><br>
  <button onclick="updateUser()">Update User</button>

  <hr>

  <!-- DELETE USER -->
  <h2>Delete User</h2>
  <input type="text" id="deleteUserId" placeholder="User ID"><br><br>
  <button onclick="deleteUser()">Delete User</button>

  <script type="module" src="script.js"></script>
</body>
</html>
