<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Shuffle Divs</title>
    <link rel="stylesheet" href="colors.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1><b> SUFFLE DIVS</b></h1>
    <div id="container">
        <div class="color-div" id="div1">Div 1</div>
        <div class="color-div" id="div2">Div 2</div>
        <div class="color-div" id="div3">Div 3</div>
        <div class="color-div" id="div4">Div 4</div>
    </div>

    <button class="shufflebutton" id="shuffleBtn">Shuffle</button>

    <script>
        function shuffle() {
            let container = $("#container");
            let divs = container.children(".color-div").toArray();
            
           
            for (let i = divs.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [divs[i], divs[j]] = [divs[j], divs[i]];
            }
            
            
            divs.forEach(div => {
                container.append(div);
            });
        }

        $(document).ready(function() {
            $("#shuffleBtn").click(function() {
                shuffle();
            });
        });
    </script>
</body>
</html>
