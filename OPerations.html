<!DOCTYPE html>
<html>
<head>
    <title>OPerations</title>
</head>
<body>

<h2>Simple Calculator</h2>

<script>
    // Take two values from user
    let num1 = (prompt("Enter first number:"));
    let num2 = (prompt("Enter second number:"));

    // Show operation options
    let choice = prompt(
        "Choose an operation:\n" +
        "1. Add\n" +
        "2. Subtract\n" +
        "3. Multiply\n" +
        "4. Divide"
    );

    let result;

    // Perform calculation
    if (choice == "1") {
        result = num1 + num2;
    } else if (choice == "2") {
        result = num1 - num2;
    } else if (choice == "3") {
        result = num1 * num2;
    } else if (choice == "4") {
        if (num2 != 0) {
            result = num1 / num2;
        } else {
            result = "Division by zero is not allowed";
        }
    } else {
        result = "Invalid choice";
    }

    // Display result
    alert("Result: " + result);
</script>

</body>
</html>
