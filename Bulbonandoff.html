<!DOCTYPE html>
<html>
<body>

<h2>Bulb ON and OFF Using One Button</h2>

<img id="myImage" src="off.jpg" style="width:100px">

<br><br>

<button onclick="toggleLight()" id="btn">Turn on the light</button>

<script>
    let lightOn = false;

    function toggleLight() {
        let image = document.getElementById("myImage");
        let button = document.getElementById("btn");

        if (lightOn) {
            image.src = "off.jpg";
            button.innerHTML = "Turn on the light";
            lightOn = false;
        } else {
            image.src = "on.jpg";
            button.innerHTML = "Turn off the light";
            lightOn = true;
        }
    }
</script>

</body>
</html>
